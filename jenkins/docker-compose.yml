version: '3.8'

services:
  jenkins:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jenkins-lab4
    restart: unless-stopped
    privileged: true
    user: root
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      # Datos persistentes de Jenkins
      - jenkins_home:/var/jenkins_home
      
      # Socket de Docker para Docker-in-Docker
      - /var/run/docker.sock:/var/run/docker.sock
      
      # Kubeconfig para despliegues en Kubernetes
      - ${HOME}/.kube:/root/.kube:ro
      - ${HOME}/.minikube:${HOME}/.minikube:ro
      
      # Directorio del proyecto (opcional, para desarrollo)
      - ../:/workspace:ro
    environment:
      - JENKINS_OPTS=--httpPort=8080
      - JAVA_OPTS=-Djenkins.install.runSetupWizard=false -Xmx2g
      - DOCKER_HOST=unix:///var/run/docker.sock
    networks:
      - jenkins-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/login"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  jenkins_home:
    driver: local

networks:
  jenkins-network:
    driver: bridge

