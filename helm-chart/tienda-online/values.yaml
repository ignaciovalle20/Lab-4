# Valores por defecto para tienda-online
# Este archivo contiene la configuración base que puede ser sobrescrita por values-dev.yaml o values-prod.yaml

# Configuración global
global:
  namespace: tienda-online
  imagePullPolicy: IfNotPresent

# Configuración del Backend
backend:
  enabled: true
  name: backend
  replicaCount: 2
  
  image:
    repository: tienda-backend
    tag: lab4
    pullPolicy: IfNotPresent
  
  service:
    type: ClusterIP
    port: 5000
    targetPort: 5000
  
  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  
  env:
    - name: NODE_ENV
      value: "production"
    - name: PORT
      value: "5000"
    - name: DB_HOST
      value: "mysql-service"
    - name: DB_PORT
      value: "3306"
    - name: DB_NAME
      valueFrom:
        configMapKeyRef:
          name: mysql-config
          key: mysql-database
    - name: DB_USER
      valueFrom:
        secretKeyRef:
          name: mysql-secret
          key: mysql-user
    - name: DB_PASSWORD
      valueFrom:
        secretKeyRef:
          name: mysql-secret
          key: mysql-password
    - name: JWT_SECRET
      valueFrom:
        secretKeyRef:
          name: backend-secret
          key: jwt-secret
  
  livenessProbe:
    httpGet:
      path: /health
      port: 5000
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  
  readinessProbe:
    httpGet:
      path: /health
      port: 5000
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3

# Configuración del Frontend
frontend:
  enabled: true
  name: frontend
  replicaCount: 2
  
  image:
    repository: tienda-frontend
    tag: lab4
    pullPolicy: IfNotPresent
  
  service:
    type: ClusterIP
    port: 80
    targetPort: 8080
  
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "200m"
  
  livenessProbe:
    httpGet:
      path: /
      port: 8080
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  
  readinessProbe:
    httpGet:
      path: /
      port: 8080
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 3

# Configuración de la Base de Datos
database:
  enabled: true
  name: mysql
  replicaCount: 1
  
  image:
    repository: tienda-database
    tag: lab4
    pullPolicy: IfNotPresent
  
  service:
    type: ClusterIP
    port: 3306
    targetPort: 3306
  
  resources:
    requests:
      memory: "512Mi"
      cpu: "500m"
    limits:
      memory: "1Gi"
      cpu: "1000m"
  
  persistence:
    enabled: true
    storageClass: "standard"
    accessMode: ReadWriteOnce
    size: 5Gi
  
  livenessProbe:
    tcpSocket:
      port: 3306
    initialDelaySeconds: 60
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 3
  
  readinessProbe:
    tcpSocket:
      port: 3306
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3

# Configuración de Secrets
secrets:
  mysql:
    rootPassword: "cm9vdDEyMw=="  # root123 (base64)
    user: "dGllbmRhX3VzZXI="      # tienda_user (base64)
    password: "dGllbmRhX3Bhc3M="  # tienda_pass (base64)
  
  backend:
    jwtSecret: "bXktc3VwZXItc2VjcmV0LWp3dC1rZXktZm9yLWxhYi00"  # my-super-secret-jwt-key-for-lab-4 (base64)

# ConfigMaps
configMaps:
  mysql:
    database: "tienda_online"
    charset: "utf8mb4"
    collation: "utf8mb4_unicode_ci"

# Ingress
ingress:
  enabled: true
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
  hosts:
    - host: tienda-online.local
      paths:
        - path: /
          pathType: Prefix
          service: frontend-service
          port: 80
        - path: /api
          pathType: Prefix
          service: backend-service
          port: 5000
  tls: []

# Autoscaling (opcional, deshabilitado por defecto)
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

# Monitoreo con Prometheus
monitoring:
  enabled: true
  serviceMonitor:
    enabled: true
    interval: 30s
    path: /metrics

