apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-config
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "tienda-online.labels" . | nindent 4 }}
    app.kubernetes.io/component: database
    app: mysql
    tier: database
data:
  mysql-database: {{ .Values.configMaps.mysql.database | quote }}
  mysql-charset: {{ .Values.configMaps.mysql.charset | quote }}
  mysql-collation: {{ .Values.configMaps.mysql.collation | quote }}

